name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # On Windows the exe can be stamped with the icon + version info, so
      # re-enable the step that package.json turns off for Linux builds.
      - run: npx electron-builder --win -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: MasterDebater-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: MasterDebater ${{ steps.v.outputs.tag }}
          files: |
            dist/*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MasterDebater-macos
          path: dist/*.dmg
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: MasterDebater ${{ steps.v.outputs.tag }}
          files: dist/*.dmg
